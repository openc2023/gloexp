<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队管理 · 环球移动快递系统</title>
<link rel="stylesheet" href="assets/css/tailwind.output.css?v=20260804b">
<link rel="stylesheet" href="assets/css/app.css?v=20260804b">
</head>
<body class="font-sans antialiased bg-gray-50 dark:bg-gray-900">
  <div id="boot-loading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-50 dark:bg-gray-900">
    <div class="w-9 h-9 rounded-full border-4 border-purple-600 border-t-transparent animate-spin"></div>
  </div>

  <div id="app" class="hidden h-screen overflow-hidden">
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-64 -translate-x-full md:translate-x-0 bg-white dark:bg-gray-800 border-r border-gray-100 dark:border-gray-700 flex flex-col justify-between overflow-y-auto"></aside>
    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/40 z-20 md:hidden"></div>

    <div class="flex flex-col h-full flex-1 min-w-0">
      <header id="topbar" class="h-16 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 flex-shrink-0 fixed top-0 right-0 left-0 md:left-64 z-10"></header>
      <main class="flex-1 overflow-y-auto mt-16">
        <div class="container px-4 md:px-6 py-6 mx-auto max-w-7xl page-fade-in">

          <div class="flex gap-1 mb-5 border-b border-gray-200 dark:border-gray-700" id="team-tabs">
            <button data-tab="accounts" class="team-tab px-4 py-2.5 text-sm font-medium border-b-2 border-purple-600 text-purple-600">账号</button>
            <button data-tab="groups" class="team-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 dark:text-gray-400">权限组</button>
            <button data-tab="update" class="team-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 dark:text-gray-400">系统更新</button>
          </div>
          <!-- 团队架构：暂缓，待定。相关代码保留在 team.js（loadOrgGroups 等），未接入 UI。 -->

          <!-- ══ 账号 ══ -->
          <div id="panel-accounts" class="team-panel grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
              <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                  <thead class="bg-gray-50 dark:bg-gray-700/40 text-xs text-gray-500 dark:text-gray-400 uppercase">
                    <tr><th class="px-4 py-3">账号</th><th class="px-4 py-3">权限组</th><th class="px-4 py-3">创建时间</th><th class="px-4 py-3 text-right">操作</th></tr>
                  </thead>
                  <tbody id="acc-tbody" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
                </table>
              </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 h-fit">
              <h3 id="acc-form-title" class="text-sm font-semibold text-gray-700 dark:text-gray-200 mb-4">新增账号</h3>
              <form id="acc-form" class="space-y-3">
                <input type="hidden" id="acc-id" />
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">账号（至少 2 字符）</label>
                  <input id="acc-username" required class="field" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">密码</label>
                  <input id="acc-password" type="text" placeholder="新增默认 glo2026 · 编辑留空不改" class="field" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">权限组</label>
                  <select id="acc-group" class="field"><option value="">未分组</option></select>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button type="button" id="acc-form-cancel" class="hidden px-3 py-1.5 text-sm rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">取消</button>
                  <button type="submit" class="px-4 py-1.5 text-sm rounded-md bg-purple-600 hover:bg-purple-700 text-white">保存</button>
                </div>
              </form>
            </div>
          </div>

          <!-- ══ 权限组 ══ -->
          <div id="panel-groups" class="team-panel hidden space-y-6">
            <!-- 列表 -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
              <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
                <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-200">权限组</h2>
                <button id="btn-new-group" class="px-3.5 py-2 text-xs font-medium rounded-md bg-purple-600 hover:bg-purple-700 text-white">+ 新增权限组</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                  <thead class="bg-gray-50 dark:bg-gray-700/40 text-xs text-gray-500 dark:text-gray-400 uppercase">
                    <tr><th class="px-4 py-3">组名</th><th class="px-4 py-3">账号数</th><th class="px-4 py-3">权限数</th><th class="px-4 py-3">数据范围</th><th class="px-4 py-3 text-right">操作</th></tr>
                  </thead>
                  <tbody id="grp-tbody" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
                </table>
              </div>
            </div>

            <!-- 新增/编辑表单（含权限矩阵），按需展开 -->
            <div id="grp-form-card" class="hidden bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
              <h3 id="grp-form-title" class="text-sm font-semibold text-gray-700 dark:text-gray-200 mb-4">新增权限组</h3>
              <form id="grp-form" class="space-y-4">
                <input type="hidden" id="grp-id" />
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">权限组名称</label>
                    <input id="grp-name" required class="field" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">应用权限模板（一键套用，之后仍可调整）</label>
                    <select id="grp-template" class="field"><option value="">不使用模板</option></select>
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                  <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">入库范围</label>
                    <select id="grp-scope-inbound" class="field"><option value="self">仅自己</option><option value="group">本团队</option><option value="global">全部</option></select></div>
                  <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">快递范围</label>
                    <select id="grp-scope-outbound" class="field"><option value="self">仅自己</option><option value="group">本团队</option><option value="global">全部</option></select></div>
                  <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">回收/统计</label>
                    <select id="grp-scope-parcels" class="field"><option value="self">仅自己</option><option value="group">本团队</option><option value="global">全部</option></select></div>
                </div>

                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-300">权限矩阵 — 按页面勾选可执行的操作</label>
                    <span class="text-[11px] text-gray-400">不勾选「查看」则该页面完全不可见</span>
                  </div>
                  <div id="perm-matrix" class="border border-gray-100 dark:border-gray-700 rounded-md divide-y divide-gray-100 dark:divide-gray-700 max-h-[26rem] overflow-y-auto"></div>
                </div>

                <div id="grp-preview" class="text-xs text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-700/40 rounded-md p-3 hidden"></div>
                <div class="flex justify-end gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                  <button type="button" id="grp-form-cancel" class="px-3 py-1.5 text-sm rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">取消</button>
                  <button type="submit" class="px-4 py-1.5 text-sm rounded-md bg-purple-600 hover:bg-purple-700 text-white">保存</button>
                </div>
              </form>
            </div>

            <!-- 权限反查 -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
              <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 uppercase">权限反查</h3>
              <p class="text-xs text-gray-400 mb-3">查一个权限点被哪些权限组、哪些账号拥有</p>
              <div class="flex gap-2 max-w-md">
                <select id="lookup-perm" class="field"></select>
                <button id="btn-lookup" class="px-3 py-2 text-xs rounded-md border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 whitespace-nowrap">查询</button>
              </div>
              <div id="lookup-result" class="mt-3 text-xs text-gray-500 dark:text-gray-400"></div>
            </div>
          </div>

          <!-- ══ 系统更新（仅超级管理员可见，服务端也强制校验 role=admin）══ -->
          <div id="panel-update" class="team-panel hidden max-w-2xl space-y-6">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
              <div class="flex items-center justify-between mb-1">
                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-200">系统更新</h3>
                <button id="btn-check-update" class="px-3 py-1.5 text-xs font-medium rounded-md border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700">检查更新</button>
              </div>
              <div id="update-status" class="text-xs text-gray-400 mt-2">点击"检查更新"查看当前版本状态</div>

              <div id="update-baseline-box" class="hidden mt-3 text-xs bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300 rounded-md px-3 py-2">
                本机还没有记录当前版本号。如果当前代码就是仓库里的最新代码（比如刚部署/刚建好仓库），点这里把它标记为基线，之后才能正确判断"有没有新版本"。
                <button id="btn-set-baseline" class="mt-2 block underline font-medium">标记当前代码为最新版本</button>
              </div>

              <div id="update-available-box" class="hidden mt-3 bg-purple-50 dark:bg-purple-500/10 rounded-md px-3 py-3">
                <div class="text-sm text-purple-700 dark:text-purple-300 font-medium">发现新版本</div>
                <div id="update-latest-msg" class="text-xs text-gray-500 dark:text-gray-400 mt-1"></div>
                <button id="btn-do-update" class="mt-3 px-4 py-2 text-sm rounded-md bg-purple-600 hover:bg-purple-700 text-white">立即更新</button>
                <p class="text-[11px] text-gray-400 mt-2">更新前会自动备份当前代码，可在下方"更新历史"里回滚。不会影响数据库和已上传的图片。</p>
              </div>
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
              <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-200 mb-3">更新历史（可回滚）</h3>
              <div id="update-backups-list" class="space-y-2 text-xs text-gray-400">暂无备份</div>
            </div>
          </div>

          <!-- ══ 团队架构 ══ -->
          <div id="panel-org" class="team-panel hidden grid grid-cols-1 lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
              <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-200 mb-3">团队列表</h3>
                <div id="org-list" class="space-y-2"></div>
              </div>
              <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
                <h3 id="org-form-title" class="text-sm font-semibold text-gray-700 dark:text-gray-200 mb-4">新增团队</h3>
                <form id="org-form" class="space-y-3">
                  <input type="hidden" id="org-id" />
                  <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">团队名称</label><input id="org-name" required class="field" /></div>
                  <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">上级团队</label><select id="org-parent" class="field"><option value="">无（顶级团队）</option></select></div>
                  <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">负责人（可多选）</label><select id="org-leaders" multiple class="field h-24"></select></div>
                  <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">描述</label><textarea id="org-desc" rows="2" class="field"></textarea></div>
                  <div class="grid grid-cols-3 gap-2">
                    <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">入库范围</label><select id="org-scope-inbound" class="field"><option value="self">仅自己</option><option value="group">本团队</option><option value="global">全部</option></select></div>
                    <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">快递范围</label><select id="org-scope-outbound" class="field"><option value="self">仅自己</option><option value="group">本团队</option><option value="global">全部</option></select></div>
                    <div><label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">回收/统计</label><select id="org-scope-parcels" class="field"><option value="self">仅自己</option><option value="group">本团队</option><option value="global">全部</option></select></div>
                  </div>
                  <div class="flex justify-between items-center gap-2 pt-2">
                    <button type="button" id="btn-delete-org" class="hidden px-3 py-1.5 text-sm rounded-md text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20">删除团队</button>
                    <div class="flex gap-2 ml-auto">
                      <button type="button" id="org-form-cancel" class="hidden px-3 py-1.5 text-sm rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">取消</button>
                      <button type="submit" class="px-4 py-1.5 text-sm rounded-md bg-purple-600 hover:bg-purple-700 text-white">保存</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <div class="lg:col-span-3 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-200">团队成员 <span id="org-members-title" class="text-gray-400 font-normal"></span></h3>
              </div>
              <div id="member-add-box" class="hidden flex flex-wrap items-end gap-2 mb-4 bg-gray-50 dark:bg-gray-700/40 rounded-md p-3">
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">添加成员</label>
                  <select id="member-user" class="field"></select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">团队角色</label>
                  <select id="member-role" class="field">
                    <option value="member">成员</option>
                    <option value="senior">资深成员</option>
                    <option value="leader">组长（仅超管可设）</option>
                  </select>
                </div>
                <button id="btn-add-member" class="px-4 py-2 text-sm rounded-md bg-purple-600 hover:bg-purple-700 text-white">添加</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                  <thead class="bg-gray-50 dark:bg-gray-700/40 text-xs text-gray-500 dark:text-gray-400 uppercase">
                    <tr><th class="px-4 py-3">成员</th><th class="px-4 py-3">团队角色</th><th class="px-4 py-3">权限组</th><th class="px-4 py-3">最近活跃</th><th class="px-4 py-3 text-right">操作</th></tr>
                  </thead>
                  <tbody id="member-tbody" class="divide-y divide-gray-100 dark:divide-gray-700">
                    <tr><td colspan="5" class="text-center text-gray-400 py-8">请选择左侧团队</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <style>.field{width:100%;border-radius:.375rem;border:1px solid rgb(209 213 219);padding:.5rem .75rem;font-size:.875rem;background:transparent}
  html.dark .field{border-color:rgb(75 85 99);color:rgb(243 244 246);background:rgb(55 65 81)}
  .field:focus{outline:none;box-shadow:0 0 0 2px rgb(168 85 247)}
  .team-tab.active{border-color:rgb(147 51 234);color:rgb(147 51 234)}</style>

  <script src="assets/js/api-client.js?v=20260804b"></script>
  <script src="assets/js/perm.js?v=20260804b"></script>
  <script src="assets/js/auth.js?v=20260804b"></script>
  <script src="assets/js/nav.js?v=20260804c"></script>
  <script src="assets/js/team.js?v=20260804b"></script>
  <script>
    document.addEventListener('auth:ready', () => { Nav.renderShell('team.html'); initTeam(); });
    Auth.protectPage();
  </script>
</body>
</html>
