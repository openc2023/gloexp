<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>操作日志 · 环球寄件</title>
<link rel="stylesheet" href="assets/css/tailwind.output.css?v=20260804a">
<link rel="stylesheet" href="assets/css/app.css?v=20260805h">
</head>
<body class="font-sans antialiased bg-gray-50 dark:bg-gray-900">
  <div id="boot-loading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-50 dark:bg-gray-900">
    <div class="w-9 h-9 rounded-full border-4 border-purple-600 border-t-transparent animate-spin"></div>
  </div>

  <div id="app" class="hidden h-screen overflow-hidden">
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-64 -translate-x-full md:translate-x-0 bg-white dark:bg-gray-800 border-r border-gray-100 dark:border-gray-700 flex flex-col justify-between overflow-y-auto"></aside>
    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/40 z-20 md:hidden"></div>

    <div class="flex flex-col h-full flex-1 min-w-0">
      <header id="topbar" class="h-16 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 flex-shrink-0 fixed top-0 right-0 left-0 md:left-64 z-10"></header>
      <main class="flex-1 overflow-y-auto mt-16">
        <div class="container px-4 md:px-6 py-6 mx-auto max-w-7xl page-fade-in">

          <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
            <div class="p-5 border-b border-gray-100 dark:border-gray-700">
              <div class="flex flex-wrap items-end gap-3">
                <div class="flex-1 min-w-[180px]">
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">综合搜索</label>
                  <input id="f-q" placeholder="用户名/对象名称/详情" class="field" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">用户名</label>
                  <input id="f-username" class="field" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">操作类型</label>
                  <select id="f-action" class="field"></select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">对象类型</label>
                  <select id="f-target" class="field"></select>
                </div>
                <div class="flex items-end gap-2">
                  <div>
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">日期</label>
                    <input id="f-date-start" type="date" class="field" />
                  </div>
                  <span class="pb-2 text-gray-400 text-xs">~</span>
                  <input id="f-date-end" type="date" class="field mb-0" />
                </div>
                <div class="flex gap-2">
                  <button id="btn-search" class="px-4 py-2 text-sm rounded-md bg-purple-600 hover:bg-purple-700 text-white">搜索</button>
                  <button id="btn-reset" class="px-4 py-2 text-sm rounded-md border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700">重置</button>
                  <button id="btn-clear" class="hidden px-4 py-2 text-sm rounded-md border border-red-200 dark:border-red-800 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20">清空日志</button>
                </div>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 dark:bg-gray-700/40 text-xs text-gray-500 dark:text-gray-400 uppercase">
                  <tr>
                    <th class="px-4 py-3">时间</th>
                    <th class="px-4 py-3">用户名</th>
                    <th class="px-4 py-3">操作</th>
                    <th class="px-4 py-3">对象类型</th>
                    <th class="px-4 py-3">对象名称</th>
                    <th class="px-4 py-3">详情</th>
                  </tr>
                </thead>
                <tbody id="lg-tbody" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
              </table>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-t border-gray-100 dark:border-gray-700">
              <div class="text-xs text-gray-400" id="lg-summary">共 0 条</div>
              <div class="flex items-center gap-2">
                <select id="lg-limit" class="field !py-1.5">
                  <option value="20">20/页</option>
                  <option value="50">50/页</option>
                  <option value="100">100/页</option>
                </select>
                <div id="lg-pagination" class="flex items-center gap-1"></div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- 清空日志确认 -->
  <div id="clear-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <div class="modal-backdrop absolute inset-0 bg-gray-900/50" data-close-clear></div>
    <div class="modal-panel relative w-full max-w-sm rounded-lg bg-white dark:bg-gray-800 shadow-xl p-6">
      <h3 class="text-base font-semibold text-red-600 mb-2">清空全部操作日志</h3>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">此操作不可恢复。请输入 <span class="font-mono font-semibold">CLEAR</span> 以确认。</p>
      <input id="clear-confirm-input" class="field mb-4" placeholder="输入 CLEAR" />
      <div class="flex justify-end gap-2">
        <button type="button" data-close-clear class="px-4 py-2 text-sm rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">取消</button>
        <button id="btn-confirm-clear" class="px-4 py-2 text-sm rounded-md bg-red-600 hover:bg-red-700 text-white">确认清空</button>
      </div>
    </div>
  </div>

  <style>.field{width:100%;border-radius:.375rem;border:1px solid rgb(209 213 219);padding:.5rem .75rem;font-size:1rem;background:transparent}
  html.dark .field{border-color:rgb(75 85 99);color:rgb(243 244 246);background:rgb(55 65 81)}
  .field:focus{outline:none;box-shadow:0 0 0 2px rgb(168 85 247)}</style>

  <script src="assets/js/api-client.js?v=20260805b"></script>
  <script src="assets/js/perm.js?v=20260804a"></script>
  <script src="assets/js/auth.js?v=20260804n"></script>
  <script src="assets/js/nav.js?v=20260804d"></script>
  <script src="assets/js/logs.js?v=20260804a"></script>
  <script>
    document.addEventListener('auth:ready', () => { Nav.renderShell('logs.html'); initLogs(); });
    Auth.protectPage();
  </script>
</body>
</html>
