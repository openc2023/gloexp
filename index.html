<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 · 快递管理系统</title>
<link rel="stylesheet" href="assets/css/tailwind.output.css?v=20260804a">
<link rel="stylesheet" href="assets/css/app.css?v=20260804a">
</head>
<body class="font-sans antialiased bg-gray-50 dark:bg-gray-900">
  <div id="boot-loading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-50 dark:bg-gray-900">
    <div class="w-9 h-9 rounded-full border-4 border-purple-600 border-t-transparent animate-spin"></div>
  </div>

  <div id="app" class="hidden h-screen overflow-hidden">
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-64 -translate-x-full md:translate-x-0 bg-white dark:bg-gray-800 border-r border-gray-100 dark:border-gray-700 flex flex-col justify-between overflow-y-auto"></aside>
    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/40 z-20 md:hidden"></div>

    <div class="flex flex-col h-full flex-1 min-w-0">
      <header id="topbar" class="h-16 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 flex-shrink-0 fixed top-0 right-0 left-0 md:left-64 z-10"></header>
      <main class="flex-1 overflow-y-auto mt-16">
        <div class="container px-4 md:px-6 py-6 mx-auto max-w-7xl page-fade-in">

          <!-- 统计卡 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
              <p class="text-xs text-gray-400">总记录数</p>
              <p id="stat-total" class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mt-1">-</p>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
              <p class="text-xs text-gray-400">今日录入</p>
              <p id="stat-today" class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mt-1">-</p>
            </div>
            <a href="outbound.html?status=pending-ship" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 hover:shadow-md transition-shadow">
              <p class="text-xs text-gray-400">待邮寄</p>
              <p id="stat-pending" class="text-2xl font-semibold text-amber-500 mt-1">-</p>
            </a>
            <a href="outbound.html?status=shipped" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 hover:shadow-md transition-shadow">
              <p class="text-xs text-gray-400">已邮寄</p>
              <p id="stat-shipped" class="text-2xl font-semibold text-emerald-500 mt-1">-</p>
            </a>
          </div>

          <!-- 今日处理流程 -->
          <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 mb-6">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-200">今日处理流程</h2>
              <span id="flow-greeting" class="text-xs text-gray-400"></span>
            </div>
            <div class="w-full h-2.5 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden">
              <div id="flow-bar" class="h-full bg-purple-600 transition-all duration-500" style="width:0%"></div>
            </div>
            <div class="flex justify-between text-xs text-gray-400 mt-2">
              <span id="flow-pending-label">待邮寄 0</span>
              <span id="flow-shipped-label">已邮寄 0</span>
            </div>
          </div>

          <!-- 快捷入口 -->
          <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5">
            <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-200 mb-4">快捷入口</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="quick-links"></div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/api-client.js?v=20260804a"></script>
  <script src="assets/js/perm.js?v=20260804a"></script>
  <script src="assets/js/auth.js?v=20260804a"></script>
  <script src="assets/js/nav.js?v=20260804a"></script>
  <script src="assets/js/dashboard.js?v=20260804a"></script>
  <script>
    document.addEventListener('auth:ready', () => { Nav.renderShell('index.html'); initDashboard(); });
    Auth.protectPage();
  </script>
</body>
</html>
