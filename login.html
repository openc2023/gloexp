<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 环球移动</title>
<script>
  // 提前应用暗色模式，跟后台/查询页共用同一个 localStorage 开关（expv7-dark），
  // 放在 <head> 里同步执行，避免先亮一下再切暗的闪烁。
  (function () {
    var dark = localStorage.getItem('expv7-dark') === '1'
      || (!localStorage.getItem('expv7-dark') && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
<link rel="stylesheet" href="assets/css/tailwind.output.css?v=20260804a">
<link rel="stylesheet" href="assets/css/app.css?v=20260805i">
</head>
<body class="font-sans antialiased bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="assets/glo-1.svg" alt="环球移动" class="w-16 h-16 object-contain mb-3" />
      <h1 class="text-xl font-semibold text-gray-800 dark:text-gray-100">环球移动</h1>
      <p class="text-sm text-gray-400 mt-1">后台管理登录</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
      <form id="login-form" class="space-y-4">
        <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 dark:bg-red-900/30 dark:text-red-300 rounded-md px-3 py-2"></div>
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">账号</label>
          <input id="username" type="text" autocomplete="username" required
                 class="w-full rounded-md border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 text-base px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">密码</label>
          <input id="password" type="password" autocomplete="current-password" required
                 class="w-full rounded-md border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 text-base px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-500" />
        </div>
        <button type="submit" id="login-submit"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium rounded-md py-2.5 transition-colors">
          登录
        </button>
      </form>
      <a href="track.html" class="mt-3 flex items-center justify-center gap-1.5 text-sm text-gray-500 dark:text-gray-400 hover:text-purple-600 dark:hover:text-purple-300 py-1">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M16 16l4 4"/></svg>
        查快递
      </a>
    </div>
    <p class="text-center text-xs text-gray-400 mt-6">© 2026 环球移动</p>
  </div>

  <script src="assets/js/api-client.js?v=20260805b"></script>
  <script src="assets/js/perm.js?v=20260804a"></script>
  <script src="assets/js/auth.js?v=20260804n"></script>
  <script>
    (async function () {
      try {
        const user = await Auth.checkSession();
        if (user) { location.href = 'index.html'; return; }
      } catch (e) { /* not logged in, stay on this page */ }
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.classList.add('hidden');
      const btn = document.getElementById('login-submit');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      btn.disabled = true;
      btn.textContent = '登录中...';
      try {
        await Auth.doLogin(username, password);
        location.href = 'index.html';
      } catch (e) {
        errBox.textContent = e.message || '登录失败';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
