; expv7 — OPcache 调优。
; 这个文件只在 PHP 以 FPM/CGI 方式运行时会被自动读取（大多数现代虚拟主机/云主机
; 都是这种方式），mod_php（Apache 模块方式）下这个文件不生效——如果部署上去之后
; 效果不明显，多半是这种情况，需要请主机商直接在 php.ini 里打开 opcache.enable。
;
; opcache.enable 本身是 PHP_INI_SYSTEM 级别的指令，理论上 .user.ini 管不了它，
; 这里写上是为了防御性覆盖（万一主机允许），真正起作用的前提还是 php.ini 里
; 已经装了 opcache 扩展、且没有被显式关掉。下面这几条（内存大小/文件数上限/
; 时间戳校验）都是 PHP_INI_ALL 级别，.user.ini 对它们一定生效。
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
